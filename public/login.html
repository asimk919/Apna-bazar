<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopnova - Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font:16px system-ui;color:#263238;display:grid;place-items:center;min-height:100vh;padding:16px}
main{width:100%;max-width:430px;background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}
h1{color:#f85606;margin-top:0}h2{font-size:20px}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font:inherit}
button{background:#f85606;color:white;border:0;font-weight:bold}
small{color:#667085}.error{color:#b42318}.ok{color:#067647}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
<h1>Shopnova</h1>
<p>Please log in or create an account to enter the marketplace.</p>
<div id="status" role="status"></div>

<section id="loginSection">
<h2>Login</h2>
<form id="login">
<input name="email" type="email" placeholder="Email address" required>
<input name="password" type="password" placeholder="Password" required>
<button>Login</button>
</form>
<p>New customer?</p>
<button type="button" id="showRegister">Create account / Sign up</button>
</section>

<section id="registerSection" class="hidden">
<h2>Create account</h2>
<form id="register">
<input name="name" placeholder="Full name" minlength="2" maxlength="80" required>
<input name="email" type="email" placeholder="Email address" required>
<input name="phone" placeholder="Phone number">
<input name="password" type="password" placeholder="Password (minimum 10 characters)" minlength="10" maxlength="72" required>
<select name="role">
<option value="customer">Customer account</option>
<option value="seller">Seller account</option>
</select>
<button>Create account</button>
</form>
<button type="button" id="showLogin">Back to login</button>
</section>
</main>
<script>
let csrf='';
const $=s=>document.querySelector(s);
function message(s,ok=false){
 $('#status').textContent=s;
 $('#status').className=ok?'ok':'error';
}
async function request(url,data){
 const r=await fetch(url,{
  method:'POST',
  credentials:'same-origin',
  headers:{'Content-Type':'application/json','x-csrf-token':csrf},
  body:JSON.stringify(data)
 });
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(d.error||'Request failed');
 if(d.csrf)csrf=d.csrf;
 return d;
}
$('#showRegister').onclick=()=>{
 $('#loginSection').classList.add('hidden');
 $('#registerSection').classList.remove('hidden');
 message('');
};
$('#showLogin').onclick=()=>{
 $('#registerSection').classList.add('hidden');
 $('#loginSection').classList.remove('hidden');
 message('');
};
$('#login').onsubmit=async e=>{
 e.preventDefault();
 try{
  const data=Object.fromEntries(new FormData(e.target));
  await request('/api/login',data);
  location.replace('/');
 }catch(err){message(err.message)}
};
$('#register').onsubmit=async e=>{
 e.preventDefault();
 try{
  const data=Object.fromEntries(new FormData(e.target));
  await request('/api/register',data);
  location.replace('/');
 }catch(err){message(err.message)}
};
(async()=>{
 try{
  const r=await fetch('/api/csrf',{credentials:'same-origin'});
  if(!r.ok)throw Error('Unable to start login. Refresh the page.');
  csrf=(await r.json()).token;
 }catch(e){message(e.message)}
})();
</script>
</body>
</html>
